<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#accbee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e7f0fd;stop-opacity:1" />
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="2" fill="#637498" opacity="0.1"/>
    </pattern>
  </defs>
  <!-- Background gradient -->
  <rect width="1200" height="600" fill="url(#bgGradient)"/>
  <!-- Decorative pattern -->
  <rect width="1200" height="600" fill="url(#dots)"/>
  <!-- Decorative shapes -->
  <circle cx="900" cy="100" r="80" fill="#637498" opacity="0.05"/>
  <circle cx="300" cy="500" r="120" fill="#637498" opacity="0.03"/>
  <!-- Text placeholder -->
  <text x="600" y="300" font-size="36" fill="#637498" text-anchor="middle" opacity="0.3" font-family="Arial, sans-serif" font-weight="bold">
    Hero Image
  </text>
</svg>
